global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 24h
    timeout server 24h

# Accept clear-text HTTP and TLS on the same public port.  TLS remains opaque
# here and is terminated by Caddy; plain HTTP reaches the private app listener.
frontend odysseus_mixed
    bind :${PUBLIC_PORT}
    tcp-request inspect-delay 2s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl is_tls req.ssl_hello_type 1
    use_backend odysseus_tls if is_tls
    default_backend odysseus_http

backend odysseus_tls
    server caddy 127.0.0.1:${TLS_BACKEND_PORT} check

backend odysseus_http
    server app 127.0.0.1:${APP_HTTP_PORT} check
