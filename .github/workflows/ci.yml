name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test-guidance:
    name: Focused test guidance (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report changed test paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report_file="$RUNNER_TEMP/focused-test-guidance.md"
          publish_report() {
            cat "$report_file"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "$report_file" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            return 0
          }

          report_unavailable() {
            {
              printf '%s\n\n' '## Focused test guidance unavailable (report-only)'
              printf '%s\n\n' "$1"
              printf '%s\n' 'Existing blocking CI remains the source of truth.'
            } > "$report_file"
            publish_report
            exit 0
          }

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            report_unavailable "Pull request base/head metadata is missing."
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request base commit is unavailable locally."
          fi

          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request head commit is unavailable locally."
          fi

          if ! python3 .github/scripts/focused_test_guidance.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" > "$report_file"; then
            report_unavailable "The focused test guidance helper could not produce a report."
          fi

          publish_report

  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      - run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      # Syntax-check our own JS (skip vendored libs in static/lib).
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    # Make Python test validation authoritative for the configured scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect whether this PR only touches repository prose outside the Pages site.
      # If so, skip the expensive pytest run while still reporting a passing check.
      - name: Check for docs-only changes
        id: docs-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Keep website/ and assets/branding/ out of this bypass: pytest owns
          # regression guards for their published-file and orphan-asset contracts.
          changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          non_docs=$(echo "$changed" | grep -Ev '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected — skipping pytest."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest-cov==6.2.1 diff-cover==9.7.1
        if: steps.docs-check.outputs.docs_only != 'true'
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
        if: steps.docs-check.outputs.docs_only != 'true'
      - name: Test with coverage report
        run: python -m pytest -q --cov=core --cov=routes --cov=src --cov-report=xml:coverage.xml --cov-report=term
        if: steps.docs-check.outputs.docs_only != 'true'
      - name: Changed Python lines coverage gate
        if: github.event_name == 'pull_request' && steps.docs-check.outputs.docs_only != 'true'
        run: diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=70
      - name: Upload coverage report
        if: steps.docs-check.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  browser-tests:
    name: Browser tests (Playwright Chromium)
    runs-on: ubuntu-latest
    # Chromium and its OS libraries live only in this test container. The
    # production image remains unchanged.
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Run real browser suites
        run: |
          python -m pytest -q \
            tests/test_replay_browser_rounds.py \
            tests/test_team_ui_browser.py \
            tests/test_team_basic_setup.py \
            tests/test_context_policy_ui.py \
            tests/test_goal_composer_controls.py \
            tests/test_i18n_message_controls.py \
            tests/test_i18n_js.py \
            tests/test_model_picker_endpoints_browser.py \
            tests/test_engineering_check_runs_ui.py \
            tests/test_engineering_requirements_ui.py \
            tests/test_engineering_check_profiles_ui.py \
            tests/test_engineering_probe_paging_ui.py \
            tests/test_engineering_probe_ui.py \
            tests/test_engineering_baseline_ui.py \
            tests/test_engineering_ui_js.py
