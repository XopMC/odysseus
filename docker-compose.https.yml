services:
  # Keep uvicorn private and terminate TLS in a small, dedicated proxy.  This
  # overlay is opt-in so existing plain-HTTP installations remain compatible.
  odysseus:
    ports: !override
      - "127.0.0.1:${APP_HTTP_PORT:-5131}:7000"
    environment:
      # Dual HTTP/HTTPS mode intentionally keeps both schemes available. The
      # app issues separate scheme-specific cookies; HSTS remains disabled.
      SECURE_COOKIES: "false"
      # Odysseus omits HSTS without clearing a policy owned by another service
      # on the same hostname. Use a dedicated hostname if that policy is active.
      HSTS_ENABLED: "false"

  odysseus-https:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    network_mode: host
    depends_on:
      odysseus:
        condition: service_healthy
    environment:
      TLS_BACKEND_PORT: "${TLS_BACKEND_PORT:-5133}"
      ODYSSEUS_UPSTREAM: "http://127.0.0.1:${APP_HTTP_PORT:-5131}"
    volumes:
      - ./deploy/https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CERT_FILE:-./data/tls/cert.pem}:/etc/odysseus-tls/cert.pem:ro
      - ${TLS_KEY_FILE:-./data/tls/key.pem}:/etc/odysseus-tls/key.pem:ro
    restart: unless-stopped

  odysseus-mixed:
    image: docker.io/library/haproxy:3.2-alpine@sha256:6343ce34a132a5dceaa24767d739df2bd519f8f7c1079ae39e4821334e8eb42e
    network_mode: host
    depends_on:
      odysseus:
        condition: service_healthy
      odysseus-https:
        condition: service_started
    environment:
      PUBLIC_PORT: "${HTTPS_PORT:-5130}"
      TLS_BACKEND_PORT: "${TLS_BACKEND_PORT:-5133}"
      APP_HTTP_PORT: "${APP_HTTP_PORT:-5131}"
    volumes:
      - ./deploy/https/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
